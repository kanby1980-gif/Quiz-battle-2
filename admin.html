<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم — بنك الأسئلة</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--pri:#6366f1;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
#app{max-width:600px;margin:0 auto;padding:16px}
h1{font-size:20px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--txt);font-size:16px;font-family:inherit}
textarea{min-height:200px}
select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--txt);font-size:16px;font-family:inherit}
.row{display:flex;gap:6px;align-items:center}.row button{width:auto;margin:0;padding:8px 12px;font-size:13px}.row input{margin:0}
button{width:100%;padding:13px;border:0;border-radius:11px;background:var(--pri);color:#fff;font-size:16px;font-weight:600;margin-top:6px;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--line);color:var(--mut)}
button.del{width:auto;background:transparent;color:var(--bad);border:1px solid var(--bad);padding:6px 12px;font-size:13px;margin:0}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{margin:0;padding:10px 4px;font-size:14px;background:transparent;border:1px solid var(--line);color:var(--mut)}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt{display:flex;align-items:center;gap:8px}.opt input[type=radio]{width:22px;height:22px;flex:none}
.msg{min-height:20px;font-size:14px;margin-top:6px;white-space:pre-wrap}.ok{color:var(--ok)}.bad{color:var(--bad)}
.item{border-top:1px solid var(--line);padding:10px 0;font-size:15px}.item small{color:var(--mut);display:block;margin:4px 0}
.hint{color:var(--mut);font-size:13px;line-height:1.7}
pre{background:#0b1220;padding:10px;border-radius:8px;font-size:13px;white-space:pre-wrap;direction:rtl}
</style>
</head>
<body><div id="app"></div>
<script>
const $ = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pw = ''; try { pw = sessionStorage.getItem('apw') || ''; } catch (e) {}
let tab = 'cats', data = null, curCat = '';

async function call(path, body) {
  const r = await fetch('/api/admin/' + path, {
    method: body ? 'POST' : 'GET',
    headers: {'Content-Type': 'application/json', 'x-admin-password': pw},
    body: body ? JSON.stringify(body) : undefined
  });
  let j = {}; try { j = await r.json(); } catch (e) {}
  j._s = r.status; return j;
}
function login(err) {
  $.innerHTML = `<h1>🔐 لوحة التحكم</h1><div class="card">
    <input id="p" type="password" placeholder="كلمة مرور الأدمن">
    <button id="go">دخول</button><div class="msg bad">${esc(err||'')}</div></div>`;
  const go = async () => {
    pw = document.getElementById('p').value;
    const d = await call('questions');
    if (d._s === 200) { try { sessionStorage.setItem('apw', pw); } catch (e) {} data = d; render(); }
    else login(d.error || 'خطأ');
  };
  document.getElementById('go').onclick = go;
  document.getElementById('p').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function reload() { const d = await call('questions'); if (d._s !== 200) return login(d.error); data = d; render(); }
const catName = id => (data.categories.find(c => c.id === id) || {name: '؟'}).name;
const catSelect = () => data.categories.length
  ? `<select id="cat">${data.categories.map(c => `<option value="${esc(c.id)}" ${c.id===curCat?'selected':''}>${esc(c.name)} (${c.count})</option>`).join('')}</select>`
  : '<div class="msg bad">أنشئ مجموعة أولاً من تبويب «المجموعات»</div>';

function render() {
  if (!curCat || !data.categories.find(c => c.id === curCat)) curCat = (data.categories[0] || {}).id || '';
  const n = data.questions.length;
  let body = '';
  if (tab === 'cats') {
    body = `<div class="card"><b>إضافة مجموعة جديدة</b>
      <div class="row"><input id="newcat" placeholder="مثال: تاريخ"><button id="addcat">إضافة</button></div><div class="msg" id="m"></div></div>
      <div class="card"><b>المجموعات</b>${data.categories.map(c => `<div class="item">
        <div class="row"><input class="rn" data-id="${esc(c.id)}" value="${esc(c.name)}"><button class="sec rb" data-id="${esc(c.id)}">حفظ الاسم</button></div>
        <small>${c.count} سؤال ${c.count < data.min ? '— لن تظهر للّاعبين متاحة قبل ' + data.min + ' أسئلة على الأقل' : '— متاحة للّاعبين ✅'}</small>
        <button class="del" data-id="${esc(c.id)}">حذف المجموعة وأسئلتها</button></div>`).join('') || '<div class="hint">لا توجد مجموعات</div>'}</div>`;
  } else if (tab === 'add') {
    body = `<div class="card"><b>إضافة سؤال</b>${catSelect()}
      <input id="q" placeholder="نص السؤال">
      ${[0,1,2,3].map(i=>`<div class="opt"><input type="radio" name="c" value="${i}" ${i===0?'checked':''}><input class="o" placeholder="الاختيار ${i+1}"></div>`).join('')}
      <div class="hint">حدد الدائرة بجانب الإجابة الصحيحة. (الاختيارات الفارغة تُتجاهل)</div>
      <button id="add">إضافة</button><div class="msg" id="m"></div></div>`;
  } else if (tab === 'bulk') {
    body = `<div class="card"><b>إضافة مجموعة أسئلة دفعة واحدة</b>${catSelect()}
      <div class="hint">كل سؤال في فقرة: أول سطر السؤال، ثم كل اختيار في سطر، وضع * قبل الإجابة الصحيحة. اترك سطراً فارغاً بين الأسئلة:</div>
      <pre>من فتح مصر عام 641م؟\n*عمرو بن العاص\nصلاح الدين\nمحمد علي\n\nمتى انتهت الحرب العالمية الثانية؟\n1939\n*1945\n1950</pre>
      <textarea id="t" placeholder="الصق الأسئلة هنا"></textarea>
      <button id="bulk">إضافة الكل</button><div class="msg" id="m"></div></div>`;
  } else {
    const list = data.questions.filter(q => q.cat === curCat).reverse();
    body = `<div class="card"><b>عرض أسئلة مجموعة</b>${catSelect()}<button class="sec" id="exp">نسخ كل الأسئلة (JSON) للنسخ الاحتياطي</button><div class="msg" id="m"></div></div>` +
      `<div class="card">${list.map(q=>`<div class="item"><div>${esc(q.q)}</div><small>${q.options.map((o,i)=>(i===q.answer?'✅ ':'• ')+esc(o)).join(' &nbsp; ')}</small><button class="del dq" data-id="${q.id}">حذف</button></div>`).join('') || '<div class="hint">لا توجد أسئلة في هذه المجموعة</div>'}</div>`;
  }
  $.innerHTML = `<h1>🛠️ لوحة التحكم</h1>
    <div class="card" style="text-align:center">المجموعات: <b>${data.categories.length}</b> · الأسئلة: <b>${n}</b> · اللاعبون: <b>${data.users}</b></div>
    <div class="tabs"><button data-t="cats" class="${tab==='cats'?'on':''}">المجموعات</button><button data-t="add" class="${tab==='add'?'on':''}">سؤال</button><button data-t="bulk" class="${tab==='bulk'?'on':''}">دفعة</button><button data-t="list" class="${tab==='list'?'on':''}">الأسئلة</button></div>${body}`;
  $.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  const sel = document.getElementById('cat'); if (sel) sel.onchange = () => { curCat = sel.value; if (tab === 'list') render(); };
  const msg = (t, ok) => { const m = document.getElementById('m'); if (m) { m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'bad'); } };

  if (tab === 'cats') {
    document.getElementById('addcat').onclick = async () => {
      const r = await call('cat/add', {name: document.getElementById('newcat').value});
      if (r.ok) { curCat = r.id; await reload(); } else msg(r.error || 'خطأ', false);
    };
    $.querySelectorAll('.rb').forEach(b => b.onclick = async () => {
      const inp = $.querySelector('.rn[data-id="' + b.dataset.id + '"]');
      const r = await call('cat/rename', {id: b.dataset.id, name: inp.value});
      if (r.ok) { b.textContent = '✅ تم'; await reload(); } else { b.textContent = r.error || 'خطأ'; }
    });
    $.querySelectorAll('.del').forEach(b => b.onclick = async () => {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'تأكيد حذف المجموعة وكل أسئلتها؟'; return; }
      await call('cat/delete', {id: b.dataset.id}); await reload();
    });
  }
  if (tab === 'add' && data.categories.length) document.getElementById('add').onclick = async () => {
    const opts = [...document.querySelectorAll('.o')].map(i => i.value.trim());
    const ans = parseInt(document.querySelector('input[name=c]:checked').value);
    const options = opts.filter(Boolean), correctText = opts[ans];
    if (!correctText) return msg('الإجابة الصحيحة المحددة فارغة', false);
    const r = await call('add', {cat: curCat, q: document.getElementById('q').value, options, answer: options.indexOf(correctText)});
    if (r.ok) { await reload(); msg('✅ تمت الإضافة إلى «' + catName(curCat) + '»', true); } else msg(r.error || 'خطأ', false);
  };
  if (tab === 'bulk' && data.categories.length) document.getElementById('bulk').onclick = async () => {
    const r = await call('bulk', {cat: curCat, text: document.getElementById('t').value});
    const errs = (r.errors || []).join('\n');
    await reload(); msg('تمت إضافة ' + (r.added || 0) + ' سؤال إلى «' + catName(curCat) + '»' + (errs ? '\n' + errs : '') + (r.error ? '\n' + r.error : ''), !errs && !r.error);
  };
  if (tab === 'list') {
    $.querySelectorAll('.dq').forEach(b => b.onclick = async () => {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'تأكيد الحذف؟'; return; }
      await call('delete', {id: b.dataset.id}); await reload();
    });
    document.getElementById('exp').onclick = async () => {
      const txt = JSON.stringify(data.questions.map(({cat,q,options,answer})=>({cat: catName(cat), q, options, answer})), null, 1);
      try { await navigator.clipboard.writeText(txt); msg('✅ تم النسخ. الصقه في ملف questions.json على GitHub لحفظه دائماً', true); }
      catch (e) { $.insertAdjacentHTML('beforeend', '<div class="card"><textarea readonly>' + esc(txt) + '</textarea></div>'); msg('انسخ النص من الأسفل', true); }
    };
  }
}
if (pw) reload(); else login();
</script>
</body></html>
